<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Danh sách Sản phẩm</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="p-4">

    <div class="container-fluid">
        <div class="custom-header">
            <h2 class="fw-bold">Quản lý danh sách sản phẩm</h2>
            <p class="mb-0 text-light opacity-75">Giao diện nhập liệu và hiển thị danh sách sản phẩm một cách trực quan, rõ ràng.</p>
        </div>

        <div class="row g-4">
            
            <div class="col-lg-4">
                <div class="custom-card">
                    <div class="card-title">Thêm sản phẩm mới</div>
                    <div class="card-subtitle">Nhập đầy đủ thông tin để thêm sản phẩm vào danh sách.</div>

                    <form id="productForm">
                        <div class="mb-3">
                            <label for="productName" class="form-label fw-semibold">Tên sản phẩm</label>
                            <input type="text" class="form-control" id="productName" placeholder="Nhập tên sản phẩm">
                        </div>

                        <div class="mb-3">
                            <label for="productCategory" class="form-label fw-semibold">Danh mục</label>
                            <select class="form-select" id="productCategory">
                                <option value="" selected>-- Chọn danh mục --</option>
                                <option value="Điện thoại">Điện thoại</option>
                                <option value="Máy tính bảng">Máy tính bảng</option>
                                <option value="Laptop">Laptop</option>
                                <option value="Phụ kiện">Phụ kiện</option>
                                <option value="Tai nghe">Tai nghe</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="productPrice" class="form-label fw-semibold">Giá</label>
                            <input type="number" class="form-control" id="productPrice" placeholder="Nhập giá">
                        </div>

                        <div class="mb-4">
                            <label for="productStatus" class="form-label fw-semibold">Trạng thái còn hàng</label>
                            <select class="form-select" id="productStatus">
                                <option value="Còn hàng" selected>Còn hàng</option>
                                <option value="Hết hàng">Hết hàng</option>
                            </select>
                        </div>

                        <div class="alert alert-danger p-2 mb-3 d-none" id="errorFeedback"></div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-grow-1">Thêm sản phẩm</button>
                            <button type="reset" class="btn btn-light border">Làm mới form</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="custom-card">
                    <div class="card-title">Danh sách sản phẩm</div>
                    <div class="card-subtitle">Danh sách sản phẩm mẫu được hiển thị từ dữ liệu hệ thống.</div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>STT</th>
                                    <th>Tên sản phẩm</th>
                                    <th>Danh mục</th>
                                    <th>Giá</th>
                                    <th>Trạng thái</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div> 
    </div>

    <script src="data/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
